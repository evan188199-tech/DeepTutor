# Temporary mypy config for the AGEN-856 read-only inventory.
# This file is NOT a repository config: it mirrors the relaxed baseline
# settings from pyproject.toml [tool.mypy] (without the per-module
# ignore_errors overrides) so per-directory latent error counts are
# measurable. Point --config-file at it; never copy into the repo tree.
[mypy]
python_version = 3.11
pretty = False
show_error_context = False
warn_return_any = False
warn_no_return = False
show_error_codes = True
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
no_implicit_optional = False
cache_dir = .mypy_cache_inventory

[mypy-tests.*]
ignore_errors = True
